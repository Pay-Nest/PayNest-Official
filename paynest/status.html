<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0a12">
<title>PayNest – Payment Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  PayNest · payment status prototype (sandbox, fictional brand, test data)

  Editing
    Long-press any text (title, amount, tags, buttons, labels, names…) .... edit it in place
    Long-press the status icon ............................................ switch scenario
    E ..... toggle editor     R ..... replay     Ctrl/Cmd+Z ..... undo     Esc ..... close panels

  Presentation mode
    URL #present hides the editor and disables long-press editing; #edit brings it back.
    To bring it back by hand: triple-tap the PayNest pill, or long-press it, or press E.
-->
<style>
:root{
  --brand:#7c6cff;--brand2:#a67cff;--bg:#0b0a12;--card:#15141f;--card2:#1b1a28;--ink:#f3f2fb;--muted:#9a98b4;
  --line:rgba(255,255,255,.08);--field:#12111d;--glass:rgba(255,255,255,.06);--shadow:0 10px 30px rgba(0,0,0,.28);
  --hero:#0d0c16;--page:#05050a;--bar:rgba(11,10,18,.82);--scrim:rgba(11,10,18,.92);--dot:rgba(255,255,255,.06);--blob:.34;
  --ok:#22c58b;--fail:#ff5470;--wait:#ffb020;--info:#2bb7d6;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --top:calc(58px + env(safe-area-inset-top));
}
[data-theme=light]{
  --brand:#5b3df5;--brand2:#8a4dff;--bg:#f3f2f9;--card:#fff;--card2:#f6f5fc;--ink:#171626;--muted:#6a6882;
  --line:rgba(23,22,38,.09);--field:#f6f5fb;--glass:rgba(255,255,255,.72);--shadow:0 10px 26px rgba(60,40,140,.09);
  --hero:#e9e6ff;--page:#d6d4e8;--bar:rgba(243,242,249,.86);--scrim:rgba(243,242,249,.92);--dot:rgba(23,22,38,.08);--blob:.3;
}
.phone[data-st=failed]{--ac:#ff5470;--ac2:#ff9a5c}
.phone[data-st=pending]{--ac:#ffb020;--ac2:#ffd36b}
.phone[data-st=success]{--ac:#22c58b;--ac2:#5be0b0}
.phone[data-st=refunded]{--ac:#2bb7d6;--ac2:#7adcf0}
.phone[data-st=processing]{--ac:var(--brand);--ac2:var(--brand2)}
.t-ok{--tc:#22c58b}.t-fail{--tc:#ff5470}.t-wait{--tc:#ffb020}.t-info{--tc:#2bb7d6}.t-idle{--tc:var(--muted)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
input::selection,textarea::selection{background:rgba(124,108,255,.35)}
:focus{outline:none}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{pointer-events:none}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--page);color:var(--ink);min-height:100vh;display:flex;justify-content:center;touch-action:manipulation;font-feature-settings:"cv11","ss01","tnum" 0;-webkit-font-smoothing:antialiased;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.mono,code{font-family:var(--mono)}
.phone{width:100%;max-width:412px;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(0,0,0,.35);transition:background .3s}

/* editable text affordance */
[data-e]{transition:background .18s,transform .18s}
[data-e].lp{background:color-mix(in srgb,var(--brand) 22%,transparent);border-radius:6px;transform:scale(.985)}
body.hl [data-e]{outline:1px dashed color-mix(in srgb,var(--brand) 70%,transparent);outline-offset:2px;border-radius:4px}

/* top bar — title fades out, bar fades in, compact status fades in (driven by --p) */
.top{--pb:0;--pc:0;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;height:var(--top);margin-bottom:calc(-1 * var(--top))}
.top::before{content:"";position:absolute;left:0;right:0;top:0;bottom:calc(-34px * (1 - var(--pc)));z-index:-2;pointer-events:none;background:linear-gradient(to bottom,var(--scrim) 0,var(--scrim) calc(100% - 34px * (1 - var(--pc))),transparent 100%);opacity:var(--pb)}
.top::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--bar);border-bottom:1px solid var(--line);opacity:var(--pc)}
.top.dock::after{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s;flex:none}
.ib:active{transform:scale(.9)}
.ib.sm{width:30px;height:30px}
.mid{flex:1;position:relative;height:38px;pointer-events:none}
.mid>*{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ttl{font-weight:600;font-size:15px;letter-spacing:-.01em;opacity:calc(1 - var(--pc));transform:translateY(calc(var(--pc) * -9px));filter:blur(calc(var(--pc) * 3px));will-change:opacity,transform}
.cmp{gap:8px;font-size:14px;font-weight:600;opacity:var(--pc);transform:translateY(calc((1 - var(--pc)) * 9px));filter:blur(calc((1 - var(--pc)) * 3px));will-change:opacity,transform}
.cmp span{color:var(--muted);font-size:12.5px;font-weight:500}
.cmp .dot{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.top .ttl [data-e],.top .ttl{pointer-events:auto}

/* hero */
.hero{position:relative;background:var(--hero);overflow:hidden;padding:calc(66px + env(safe-area-inset-top)) 20px 60px;text-align:center;transition:background .3s}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;-webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%);pointer-events:none}
.aurora{position:absolute;inset:0;pointer-events:none}
.blob{position:absolute;width:270px;height:270px;border-radius:50%;filter:blur(60px);opacity:var(--blob);transition:background 1s}
.b1{background:var(--ac);top:-100px;left:-80px;animation:d1 16s ease-in-out infinite alternate}
.b2{background:var(--ac2);top:30px;right:-100px;opacity:calc(var(--blob) * .7);animation:d2 20s ease-in-out infinite alternate}
.b3{background:var(--brand);bottom:-160px;left:25%;opacity:calc(var(--blob) * .55);animation:d3 18s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(60px,40px) scale(1.12)}}
@keyframes d2{to{transform:translate(-50px,60px) scale(.92)}}
@keyframes d3{to{transform:translate(50px,-30px) scale(1.15)}}
.hin{position:relative;z-index:2}
.brandpill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;font-weight:600;letter-spacing:-.01em}
.brandpill .sep{width:1px;height:12px;background:var(--line)}
.brandpill .sec{display:flex;align-items:center;gap:4px;font-weight:500;font-size:11.5px;color:var(--muted)}

.sicon{position:relative;width:104px;height:104px;margin:24px auto 16px}
.sicon::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--ac);filter:blur(26px);opacity:.38;animation:glow 3.5s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.18;transform:scale(1.15)}}
.sicon svg{position:relative;width:104px;height:104px;overflow:visible}
.pulse{position:absolute;inset:12px;border-radius:50%;border:1.5px solid var(--ac);opacity:0;animation:pulse 3s 1.4s ease-out infinite}
.pulse.p2{animation-delay:2.9s}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.ring-bg{fill:none;stroke:var(--line);stroke-width:3}
.ring{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:48px 48px;animation:draw .9s .1s cubic-bezier(.65,0,.35,1) forwards}
.orbit{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-dasharray:26 74;transform-origin:48px 48px;animation:spin 1.3s linear infinite}
.disc{transform-origin:48px 48px;animation:discin .55s .45s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.glyph{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .5s .9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes discin{from{transform:scale(0)}to{transform:scale(1)}}
.shake{animation:shake .55s 1.25s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.burst{position:absolute;left:50%;top:50%;pointer-events:none}
.burst i{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--ac);opacity:0;animation:burst .95s 1s ease-out forwards}
.burst i:nth-child(even){background:var(--ac2);width:4px;height:4px;margin:-2px}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateY(-44px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-86px) scale(.3)}}

.st-title{font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.st-sub{font-size:14px;color:var(--muted);margin:6px auto 0;max-width:300px;line-height:1.5}
.amt{font-size:46px;font-weight:700;letter-spacing:-.035em;margin-top:22px;font-variant-numeric:tabular-nums;line-height:1;transition:opacity .4s,filter .4s}
.amt small{font-size:26px;font-weight:500;opacity:.6;margin-right:4px;vertical-align:.38em;letter-spacing:0}
.amt .dec{font-size:24px;font-weight:600;opacity:.45;letter-spacing:-.01em}
.amt.dim{opacity:.5;filter:blur(1.5px)}
.words{font-size:12px;color:var(--muted);margin:10px auto 0;max-width:300px;line-height:1.4}
.words:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:6px 14px 6px 6px;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 54%),hsl(calc(var(--h) + 36) 62% 42%))}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12px;color:var(--muted);border:1px solid var(--line)}
.chip.cp{font-family:var(--mono);font-size:11.5px;color:var(--ink)}

/* body */
.body{position:relative;z-index:3;margin-top:-28px;border-radius:28px 28px 0 0;background:var(--bg);padding-top:22px;transition:background .3s}
.stack>*{opacity:0;transform:translateY(16px)}
.stack.in>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) calc(var(--i) * 60ms) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 16px 6px}
.qb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--muted)}
.qc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--card);border:1px solid var(--line);transition:transform .2s cubic-bezier(.2,1.4,.4,1),background .2s}
.qb:active .qc{transform:scale(.9)}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:14px 16px;padding:18px;box-shadow:var(--shadow);transition:background .3s}
.h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.h h3{font-size:14px;font-weight:600;letter-spacing:-.005em;line-height:1.3}
.hs{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;color:var(--tc,var(--muted));background:rgba(128,128,160,.12);background:color-mix(in srgb,var(--tc,#8888a8) 14%,transparent);white-space:nowrap;flex:none}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* money */
.money{display:flex;gap:14px;align-items:flex-start}
.mic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--tc);background:rgba(128,128,160,.12);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.mt{font-size:15px;font-weight:600;letter-spacing:-.01em}
.money p{font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px}
.money .tag{margin-top:10px}

/* payment journey — vertical rail */
.rt-sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rt-sum b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.rt-sum span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 0 22px}
.sg{height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.sg::after{content:"";position:absolute;inset:0;border-radius:3px;background:var(--sgc,transparent)}
.sg.rs-ok{--sgc:#22c58b}.sg.rs-info{--sgc:var(--info)}.sg.rs-fail{--sgc:var(--fail)}.sg.rs-wait{--sgc:var(--wait)}
.sg.rs-wait::after{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.stack.anim .sg::after{animation:fillx .5s calc(var(--i) * .16s + .3s) cubic-bezier(.4,0,.2,1) both;transform-origin:left}
.stack.anim .sg.rs-wait::after{animation:fillx .5s calc(var(--i) * .16s + .3s) cubic-bezier(.4,0,.2,1) both,breathe 1.6s 1.6s ease-in-out infinite}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rt-row{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px;padding-bottom:22px}
.rt-row:last-child{padding-bottom:0}
.rt-row::before{content:"";position:absolute;left:19px;top:46px;bottom:4px;width:2px;border-radius:2px;background:var(--line);transform-origin:top}
.rt-row:last-child::before{display:none}
.ln-ok::before{background:#22c58b}
.ln-info::before{background:var(--info)}
.ln-fail::before{background:linear-gradient(#22c58b,var(--fail))}
.ln-wait::before{background:linear-gradient(#22c58b,var(--wait))}
.ln-idle::before{width:0;background:none;border-left:2px dashed var(--line)}
.stack.anim .rt-row::before{animation:lndraw .55s calc(var(--i) * .16s + .35s) cubic-bezier(.4,0,.2,1) both}
@keyframes lndraw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rt-dot{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1.5px solid var(--line);color:var(--muted)}
.stack.anim .rt-dot{animation:nodein .45s calc(var(--i) * .16s + .2s) both cubic-bezier(.2,1.3,.4,1)}
@keyframes nodein{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.rs-ok .rt-dot{color:#22c58b;border-color:rgba(34,197,139,.55);background:rgba(34,197,139,.12)}
.rs-info .rt-dot{color:var(--info);border-color:rgba(43,183,214,.55);background:rgba(43,183,214,.12)}
.rs-fail .rt-dot{color:var(--fail);border-color:var(--fail);background:rgba(255,84,112,.14);box-shadow:0 0 0 4px rgba(255,84,112,.12)}
.rs-wait .rt-dot{color:var(--wait);border-color:rgba(255,176,32,.6);background:rgba(255,176,32,.12)}
.rs-wait .rt-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;border-top-color:var(--wait);animation:spin 1.4s linear infinite}
.rs-idle .rt-dot{border-style:dashed;opacity:.65}
.rt-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--fail);color:#fff;display:grid;place-items:center;border:2px solid var(--card)}
.rt-body{min-width:0;padding-top:1px}
.rt-name{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-role{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.rt-st{font-size:12px;font-weight:600;margin-top:5px;line-height:1.35;color:var(--muted)}
.rs-ok .rt-st{color:#22c58b}.rs-info .rt-st{color:var(--info)}.rs-fail .rt-st{color:var(--fail)}.rs-wait .rt-st{color:var(--wait)}
.rt-st em{font-style:normal;font-weight:500;color:var(--muted)}
.rt-meta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:2px}
.rt-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rt-lat{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rs-fail .rt-lat{color:var(--fail);border-color:rgba(255,84,112,.35);background:rgba(255,84,112,.1)}
.rs-wait .rt-lat{color:var(--wait);border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.1)}

/* reason */
.reason{border-radius:14px;padding:14px;background:rgba(128,128,160,.1);background:color-mix(in srgb,var(--tc) 10%,transparent);border:1px solid rgba(128,128,160,.2);border:1px solid color-mix(in srgb,var(--tc) 26%,transparent)}
.rc-code{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(128,128,160,.22)}
.rc-code.nb{margin-top:0;padding-top:0;border-top:0}
.rc-code span{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.rc-code b{display:block;margin-top:3px;font-size:13px;font-weight:600;color:var(--tc);letter-spacing:.015em;word-break:break-all}
.mini{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted);flex:none}
.reason p{font-size:13.5px;line-height:1.55}

/* steps */
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;margin-bottom:8px;border-radius:14px;background:var(--card2);border:1px solid var(--line);transition:transform .15s,border-color .2s}
.step:last-child{margin-bottom:0}.step:active{transform:scale(.985)}
.sic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--brand);background:rgba(124,108,255,.14);background:color-mix(in srgb,var(--brand) 14%,transparent)}
.stx{flex:1;min-width:0;display:block}.stx b{display:block;font-size:13.5px;font-weight:600}.stx em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.step>svg:last-child{color:var(--muted);flex:none}

/* receipt */
.rc{padding:0;overflow:hidden}
.rc-head{padding:18px 18px 18px;background:linear-gradient(180deg,rgba(128,128,160,.1),transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 11%,transparent),transparent)}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rc-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:-.01em}
.rc-brand small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
.rc-amt{margin-top:18px;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.rc-amt small{font-size:20px;font-weight:500;opacity:.6;margin-right:3px;vertical-align:.25em}
.rc-amt .dec{font-size:19px;font-weight:600;opacity:.45}
.rc-sub{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.rc-sub b{color:var(--ink);font-weight:600}
.rc-flow{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);align-items:center;gap:6px;margin:0 18px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rc-p{text-align:center;min-width:0}
.pav{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;margin:0 auto 8px;background:linear-gradient(135deg,hsl(var(--h) 60% 52%),hsl(calc(var(--h) + 36) 60% 40%))}
.prole{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.pname{font-size:13.5px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pupi{font-family:var(--mono);font-size:10.5px;color:var(--brand);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbank{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--card2);border:1px solid var(--line)}
.rc-sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:18px 18px 4px}
.rc-rows{padding:0 18px}
.rc-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;font-size:13px;border-bottom:1px solid var(--line)}
.rc-row:last-child{border-bottom:0}
.rc-row span{color:var(--muted);flex:none}
.rc-row b{font-weight:600;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
.rc-row b.cp{font-family:var(--mono);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.rc-row b.cp svg{color:var(--muted)}
.rc-total{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 18px 0;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.rc-total span{font-size:13px;font-weight:600}
.rc-total b{font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rc-total small{display:block;font-size:12px;font-weight:500;margin-top:3px}
.stack.anim .rc-row{animation:rise .5s calc(var(--r) * 45ms + 500ms) both}
.rc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px}
.btn.sm{height:44px;border-radius:12px;font-size:13.5px;font-weight:600}
.rc-foot{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;padding:0 18px 18px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
.rc-foot .sb{padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* timeline */
.ev{position:relative;padding:0 0 16px 34px}
.ev:last-of-type{padding-bottom:0}
.ev::before{content:"";position:absolute;left:10px;top:26px;bottom:-2px;width:2px;background:var(--line)}
.ev:last-of-type::before{display:none}
.ev .dt{position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--tc)}
.ev.idle .dt{background:var(--card2);border:1.5px dashed var(--muted)}
.ev.wait .dt::after{content:"";width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.evb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left}
.evt{font-size:13.5px;font-weight:600;letter-spacing:-.005em;line-height:1.35}
.ev.idle .evt{color:var(--muted);font-weight:500}
.ev.fail .evt{color:var(--fail)}
.evr{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.evr svg{transition:transform .2s}
.ev.open .evr svg{transform:rotate(180deg)}
.evs{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.evs .evl{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.evx{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:12px}
.ev.open .evx{display:block}
.evx div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.evx span{color:var(--muted)}.evx b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.evx code{font-size:11px;color:var(--ink)}
.tl-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.tl-foot div{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tl-foot code{color:var(--ink);font-size:11px}
.link{color:var(--brand);font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}

details.tech summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;cursor:pointer}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary svg{transition:transform .25s}details.tech[open] summary svg{transform:rotate(180deg)}
details.tech pre{margin-top:14px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11.5px;line-height:1.55;overflow-x:auto;font-family:var(--mono);white-space:pre}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:10px 24px 28px;line-height:1.8}
.foot span{display:inline-flex;align-items:center;gap:6px}

/* action bar */
.bar{position:sticky;bottom:0;z-index:25;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.btn{position:relative;overflow:hidden;height:50px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em;background:var(--card);color:var(--ink);transition:transform .15s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.bar .btn.sec{padding:0 18px;font-size:14px}
.btn.pri{border:0;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 22px -12px var(--brand)}
.btn:disabled{opacity:.55;cursor:progress}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.btn .ld{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}

/* sheets + toast */
.msbd{position:fixed;inset:0;background:rgba(5,4,12,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:120}
.msbd.on{opacity:1;pointer-events:auto}
.msheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:412px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));z-index:130;transition:transform .36s cubic-bezier(.2,.9,.25,1);border:1px solid var(--line);border-bottom:0;max-height:88vh;overflow-y:auto}
.msheet.on{transform:translate(-50%,0)}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.msheet h4{font-size:16px;font-weight:600;letter-spacing:-.01em}.msheet>p{font-size:13px;color:var(--muted);margin:4px 0 14px;line-height:1.5}
.edin{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:15px;background:var(--field);color:var(--ink)}
.edin:focus{border-color:var(--brand)}
textarea.edin{min-height:84px;resize:vertical;line-height:1.5}
.edact{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);background:#1d1c2e;color:#fff;font-size:13px;font-weight:500;padding:11px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.28s;z-index:140;max-width:380px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* editor */
.fab{position:fixed;right:0;top:50%;margin-top:-32px;z-index:60;width:22px;height:64px;border-radius:14px 0 0 14px;border:1px solid var(--line);border-right:0;background:var(--card);color:var(--muted);display:grid;place-items:center;opacity:.5;transition:.2s}
.fab:hover,.fab:active{opacity:1;width:30px}
.drawer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:412px;height:82vh;background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;border:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.4);z-index:100;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.drawer.closed{transform:translate(-50%,105%)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;position:relative}
.dh .grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);margin:0}
.dh b{display:flex;align-items:center;gap:8px;font-size:14.5px}
.dh div{display:flex;gap:8px}
.tabs{display:flex;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.panel{flex:1;overflow-y:auto;padding:14px 16px 30px}
.pane{display:none}.pane.on{display:block}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.pchip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:12.5px;color:var(--ink)}
.pchip.on{border-color:var(--brand);background:rgba(124,108,255,.15);color:var(--brand);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}
.field label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.field label a,.field .hint{font-size:11px;font-weight:600}
.field label a{color:var(--brand);text-decoration:none}.hint{color:var(--fail)}.hint2{font-weight:400;font-family:var(--mono);font-size:10px;opacity:.7;text-align:right;word-break:break-all}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:13.5px;width:100%;background:var(--field);color:var(--ink)}
.field input[type=color]{padding:2px;height:38px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field input.bad{border-color:var(--fail)}
.field textarea{resize:vertical;min-height:60px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:23px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:none}
.sw input::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--brand)}.sw input:checked::after{left:19.5px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.tools button{border-radius:11px;padding:11px;font-size:13px;font-weight:600;background:rgba(124,108,255,.15);color:var(--brand)}
.tools .danger{background:rgba(255,84,112,.14);color:var(--fail)}
.tools .wide{grid-column:1/-1}
.sub{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.snap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;font-size:13px}
.snap button{font-size:12px;font-weight:600;color:var(--brand);padding:4px 8px}.snap .dl{color:var(--fail)}
.hintbox{font-size:12px;color:var(--muted);line-height:1.65;margin-top:16px;padding:12px;border-radius:12px;background:var(--card2)}
.hintbox kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--card)}
@media(min-width:980px){
  .drawer{left:auto;right:20px;top:20px;bottom:20px;height:auto;width:380px;max-width:none;border-radius:22px;transform:none}
  .drawer.closed{transform:translateX(calc(100% + 40px))}
  .dh .grab{display:none}.fab{right:0}
}

/* avatars */
.avt{--s:40px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .32);display:inline-grid;place-items:center;flex:none;color:#fff;font-weight:600;font-size:calc(var(--s) * .42);line-height:1;letter-spacing:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -7px 14px rgba(0,0,0,.14);overflow:hidden}
.avt.circle{border-radius:50%}
.avt svg{width:80%;height:80%;overflow:visible}
.pf{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;background:var(--card2)}
.pf-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pf-t{flex:1;min-width:0}.pf-t b{display:block;font-size:14px}.pf-t small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-b{display:flex;gap:6px}
.pf-b button,.mini2{font-size:12px;font-weight:600;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:11px;background:var(--field);border:1px solid var(--line);margin-bottom:12px}
.segs button{padding:7px 4px;font-size:12.5px;font-weight:600;border-radius:8px;color:var(--muted);transition:background .2s,color .2s}
.segs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pf-c{display:flex;gap:10px;margin-bottom:12px}.pf-c .field{flex:1}
.pf-n{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sw2{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.sw2.on{border-color:var(--card2);box-shadow:0 0 0 2px var(--brand)}
.sw2:active{transform:scale(.88)}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.faces button{display:grid;place-items:center;padding:6px;border-radius:14px;border:2px solid transparent;transition:transform .15s}
.faces button.on{border-color:var(--brand)}.faces button:active{transform:scale(.92)}

/* payment methods */
.pm-h{margin-bottom:14px}.pm-h h4{font-size:17px}.pm-h p,.sh-h p{font-size:13px;color:var(--muted);line-height:1.5}.pm-h p{margin:4px 0 0!important}
.pm-amt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:12px;font-size:13px;color:var(--muted)}
.pm-amt b{color:var(--ink);font-size:17px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pm-list{display:flex;flex-direction:column;gap:8px}
.pm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);transition:border-color .2s,background .2s,transform .15s}
.pm.on{border-color:var(--brand);background:rgba(124,108,255,.1);background:color-mix(in srgb,var(--brand) 9%,var(--card2))}
.pm:active{transform:scale(.985)}
.pm-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--brand);background:rgba(124,108,255,.14);background:color-mix(in srgb,var(--brand) 14%,transparent)}
.pm-tx{flex:1;min-width:0}
.pm-tx b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-tx em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-tx i{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--wait);margin-top:4px}
.pm-r{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;transition:background .2s,border-color .2s}
.pm.on .pm-r{background:var(--brand);border-color:var(--brand)}
.pm-r svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.2,1.5,.4,1)}
.pm.on .pm-r svg{opacity:1;transform:none}
.mc{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;background:var(--card2);transition:opacity .2s}
.mc.sel{border-color:var(--brand)}.mc.off .mc-h{opacity:.55}
.mc-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mc-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--brand);background:rgba(124,108,255,.14);background:color-mix(in srgb,var(--brand) 14%,transparent)}
.mc-t{flex:1;min-width:0}.mc-t b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mc-t small{font-size:11.5px;color:var(--muted)}
.mc-b{display:flex;gap:4px}
.mc-b button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted)}
.mc-b button.dl{color:var(--fail)}.mc-b button:disabled,.mini2:disabled{opacity:.35}
.mc-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.mc-sw .sw{flex:1;border:0;padding:6px 0;gap:10px}
.mini2.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mc-sum{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:12px;font-size:12px;color:var(--muted)}.mc-sum b{font-size:14px;color:var(--ink)}
.sw select{border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--field);color:var(--ink);font:inherit;font-size:12.5px;max-width:55%}

/* receipt parties */
.rc-flow{align-items:start!important}
.rc-arrow{margin-top:3px}
.pav0{display:grid!important;margin:0 auto 8px}
.pupi{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:3px;max-width:100%;font-family:var(--mono);font-size:10.5px;color:var(--brand);min-height:20px}
.pupi .uv{display:grid;min-width:0}
.pupi .uv>span{grid-area:1/1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .22s,filter .22s,transform .22s}
.pupi .u-mask{opacity:0;filter:blur(4px);transform:translateY(3px);pointer-events:none}
.pupi.hid .u-plain{opacity:0;filter:blur(4px);transform:translateY(-3px);pointer-events:none}
.pupi.hid .u-mask{opacity:1;filter:none;transform:none}
.eye{position:relative;width:22px;height:22px;border-radius:7px;flex:none;color:var(--muted);display:grid;place-items:center;transition:background .15s,color .15s,transform .15s}
.eye:active{transform:scale(.88);background:var(--glass)}
.eye svg{grid-area:1/1;transition:opacity .2s,transform .25s cubic-bezier(.2,1.4,.4,1)}
.eye .i-on{opacity:0;transform:scale(.5) rotate(-25deg)}
.pupi.hid .eye .i-on{opacity:1;transform:none}
.pupi.hid .eye .i-off{opacity:0;transform:scale(.5) rotate(25deg)}
.pstat{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 9px 3px 7px;border-radius:99px;font-size:11px;font-weight:600;color:var(--tc,var(--muted));background:rgba(128,128,160,.12);background:color-mix(in srgb,var(--tc,#8888a8) 13%,transparent);max-width:100%}
.pstat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* share sheet + capture stage */
.cap-root{position:fixed!important;left:-10000px;top:0;width:400px!important;max-width:none!important;min-height:0!important;box-shadow:none!important;pointer-events:none}
.cap-root *{animation:none!important;transition:none!important}
.cap-pad{padding:18px;background:var(--bg)}
.cap-col{display:flex;flex-direction:column;gap:12px}
.cap-root .c{margin:0}
.cap-root .hero{padding:30px 20px 38px;border-radius:26px}
.cap-root .ring,.cap-root .glyph{stroke-dashoffset:0!important}
.cap-root .disc{transform:none!important}
.cap-root .pulse,.cap-root .burst{display:none}
.sh-h h4{font-size:17px}.sh-h p{margin:4px 0 14px!important}
.shp{display:grid;place-items:center;padding:12px;border-radius:16px;background:var(--field);border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.shp img{display:block;max-width:100%;max-height:38vh;width:auto;height:auto;border-radius:10px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:rise .4s both}
.shk{width:100%;height:260px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%) 0 0/200% 100%,var(--card2);animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.shk span{font-size:12.5px;color:var(--muted);font-weight:500}
.shm{margin-bottom:12px}
.shact{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shact .pri{grid-column:1/-1;height:50px}

.pbank{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.4}
.cap-root.cap-status{width:440px!important}
.cap .rc-foot{padding-top:16px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.ring,.glyph{stroke-dashoffset:0}}
@media print{
  .top,.bar,.drawer,.fab,.qa,.msheet,.msbd,.toast,.aurora,.hero::after,.rc-actions{display:none!important}
  body{background:#fff}.phone{box-shadow:none;max-width:none}.stack>*{opacity:1!important;transform:none!important;animation:none!important}
  body.print-r{--ink:#111;--muted:#555;--card:#fff;--card2:#f4f4f6;--line:#dcdce4;--bg:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-r .hero,body.print-r .stack>*:not(#cReceipt){display:none!important}
  body.print-r .body{margin:0;padding:0}body.print-r .c{box-shadow:none;margin:0 auto;max-width:480px}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="pnGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--brand)"/><stop offset="1" style="stop-color:var(--brand2)"/></linearGradient></defs></svg>

<div class="phone" id="phone" data-st="processing">

  </header>

  <section class="hero" id="hero">
    <div class="aurora"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
    <div class="hin">
      <div class="brandpill" id="logoBtn" data-e="x:brand"></div>
      <div class="sicon" id="sicon" data-e="x:status"></div>
      <h1 class="st-title" data-o="heroTitle" data-e="s:statusTitle"></h1>
      <p class="st-sub" data-o="heroSub" data-e="s:statusSub"></p>
      <div class="amt" id="amt" data-e="s:amount"><small data-e="s:cur"></small><span class="int"></span><span class="dec"></span></div>
      <div class="words" data-o="amountWords" data-e="l:words"></div>
      <div class="pill" id="toPill"></div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <main class="body">
    <div class="stack" id="stack">
      <div class="qa" id="qa" style="--i:0"></div>
      <section class="c" id="cMoney" style="--i:1"></section>
      <section class="c" id="cJourney" style="--i:2"></section>
      <section class="c" id="cReason" style="--i:3"></section>
      <section class="c" id="cSteps" style="--i:4"></section>
      <section class="c rc" id="cReceipt" style="--i:5"></section>
      <section class="c" id="cAudit" style="--i:6"></section>
      <section class="c" id="cTech" style="--i:7">
        <details class="tech"><summary><span data-e="l:tech.title" data-def="Developer payload">Developer payload</span> <span id="chev"></span></summary><pre id="json"></pre></details>
      </section>
      <footer class="foot" id="foot" style="--i:8"></footer>
    </div>
  </main>

  <div class="bar" id="bar"></div>
  <button class="fab" id="fab" aria-label="Open editor"></button>

  <aside class="drawer closed" id="drawer" aria-label="Editor">
    <div class="dh"><span class="grab"></span><b id="dtitle"></b><div><button class="ib sm" id="bUndo" aria-label="Undo"></button><button class="ib sm" id="dclose" aria-label="Close"></button></div></div>
    <div class="tabs" id="tabs"></div>

function journeyHTML(){
 const st=S.state,n=fn(),A=buildAudit(),nd=nodeDefs(),sec=S.showSec;

 const states=nd.map((_,i)=>ST(i));

 const cleared=states.filter(s=>s==="ok"||s==="info").length;
 const head=st==="success"?X("jr.sum.success","All 5 checkpoints cleared"):st==="refunded"?X("jr.sum.refunded","Reversed to your account"):X("jr.sum.partial","{n} of 5 checkpoints cleared").replace("{n}",cleared);

 }).join("");
